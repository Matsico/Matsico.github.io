<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vin & Vleugel | Admin</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../style.css">

<style>
body { padding-top:110px; }
.hidden { display:none; }
.product-img { height:120px; object-fit:cover; }
</style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark fixed-top">
<div class="container">
<a class="navbar-brand" href="../index.html">
<img src="../images/logo.png" height="40" class="me-2">
Vin & Vleugel Admin
</a>
</div>
</nav>

<div class="container">

<!-- LOGIN -->
<div id="loginSection">
<h3>Login</h3>
<input type="password" id="token" class="form-control mb-2" placeholder="GitHub Token">
<button class="btn btn-dark" onclick="login()">Login</button>
</div>

<!-- ADMIN -->
<div id="adminSection" class="hidden">

<h3 class="mt-4">Nieuw / Bewerken</h3>

<input type="hidden" id="editIndex">

<input type="text" id="titel" class="form-control mb-2" placeholder="Titel">
<textarea id="beschrijving" class="form-control mb-2" placeholder="Beschrijving"></textarea>
<input type="number" id="prijs" class="form-control mb-2" placeholder="Prijs">

<select id="producttype" class="form-select mb-2">
<option value="Dier">Dier</option>
<option value="Product">Product</option>
</select>

<select id="hoofdcategorie" class="form-select mb-2">
<option value="Vissen">Vissen</option>
<option value="Vogels">Vogels</option>
</select>

<select id="subcategorie" class="form-select mb-2">
<option value="">Geen</option>
<option>Aquaria</option>
<option>Techniek</option>
<option>Decoratie</option>
<option>Planten</option>
<option>Plantenvoeding</option>
<option>Voeders</option>
<option>Medicatie</option>
<option>Diverse</option>
<option>Kooien</option>
<option>Volières</option>
<option>Bodembedekking</option>
<option>Verrijking</option>
<option>Transport</option>
</select>

<input type="file" id="afbeelding" class="form-control mb-2" accept="image/*">

<button class="btn btn-success" onclick="saveProduct()">Opslaan</button>

<hr>

<h3>Producten</h3>
<div id="productList" class="row"></div>

</div>
</div>

<script>

let token = "";
let producten = [];
const repo = "Matsico/Matsico.github.io";
const bestandPad = "data/assortiment.json";

function login(){
token = document.getElementById("token").value;
if(!token) return alert("Token nodig");

document.getElementById("loginSection").classList.add("hidden");
document.getElementById("adminSection").classList.remove("hidden");

loadData();
}

async function getFile(){
const res = await fetch(
`https://api.github.com/repos/${repo}/contents/${bestandPad}`,
{headers:{Authorization:`token ${token}`}}
);
return res.json();
}

async function loadData(){
const file = await getFile();
producten = JSON.parse(atob(file.content));
render();
}

function render(){
const container = document.getElementById("productList");
container.innerHTML="";

producten.forEach((p,i)=>{
container.innerHTML+=`
<div class="col-md-4 mb-4">
<div class="card p-3">
<img src="../${p.afbeelding}" class="product-img mb-2">
<h5>${p.titel}</h5>
<small>${p.hoofdcategorie} ${p.subcategorie? "• "+p.subcategorie:""}</small>
<p>${p.beschrijving}</p>
<strong>€ ${p.prijs}</strong>
<div class="mt-2">
<button class="btn btn-warning btn-sm" onclick="edit(${i})">Edit</button>
<button class="btn btn-danger btn-sm" onclick="removeProduct(${i})">Delete</button>
</div>
</div>
</div>`;
});
}

function edit(i){
const p = producten[i];
document.getElementById("editIndex").value=i;
document.getElementById("titel").value=p.titel;
document.getElementById("beschrijving").value=p.beschrijving;
document.getElementById("prijs").value=p.prijs;
document.getElementById("producttype").value=p.producttype;
document.getElementById("hoofdcategorie").value=p.hoofdcategorie;
document.getElementById("subcategorie").value=p.subcategorie || "";
}

function removeProduct(i){
if(!confirm("Verwijderen?")) return;
producten.splice(i,1);
upload();
}

async function saveProduct(){

const index = document.getElementById("editIndex").value;
const titel = document.getElementById("titel").value;
const beschrijving = document.getElementById("beschrijving").value;
const prijs = document.getElementById("prijs").value;
const producttype = document.getElementById("producttype").value;
const hoofd = document.getElementById("hoofdcategorie").value;
const sub = document.getElementById("subcategorie").value;
const fileInput = document.getElementById("afbeelding");

let afbeelding = "";

if(fileInput.files[0]){
const reader = new FileReader();
reader.onload = async function(){
const base64 = reader.result.split(",")[1];
const imgPath = "images/"+titel.toLowerCase().replace(/\s+/g,"-")+".jpg";

await fetch(`https://api.github.com/repos/${repo}/contents/${imgPath}`,{
method:"PUT",
headers:{Authorization:`token ${token}`,"Content-Type":"application/json"},
body:JSON.stringify({
message:"Upload image",
content:base64
})
});

afbeelding = imgPath;
saveToArray();
};
reader.readAsDataURL(fileInput.files[0]);
}else{
saveToArray();
}

function saveToArray(){
const obj={
titel,
beschrijving,
prijs,
producttype,
hoofdcategorie:hoofd,
subcategorie: producttype==="Product"?sub:"",
afbeelding: afbeelding || producten[index]?.afbeelding || ""
};

if(index===""){
producten.push(obj);
}else{
producten[index]=obj;
}

upload();
}
}

async function upload(){

const file = await getFile();

await fetch(`https://api.github.com/repos/${repo}/contents/${bestandPad}`,{
method:"PUT",
headers:{Authorization:`token ${token}`,"Content-Type":"application/json"},
body:JSON.stringify({
message:"Update assortiment",
content:btoa(JSON.stringify(producten,null,2)),
sha:file.sha
})
});

loadData();
}

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
