<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Admin | Vin & Vleugel</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<div class="container" style="margin-top:80px; max-width:700px;">

  <div id="login-box">
    <h2 class="mb-3">Admin Login</h2>
    <input type="password" id="wachtwoord" class="form-control mb-3">
    <button class="btn btn-dark w-100" onclick="checkLogin()">Inloggen</button>
  </div>

  <div id="admin-panel" style="display:none;">

    <h1 class="mb-4">Product toevoegen</h1>

    <form id="product-form">

      <div class="mb-3">
        <label>Titel</label>
        <input type="text" class="form-control" id="titel" required>
      </div>

      <div class="mb-3">
        <label>Beschrijving</label>
        <textarea class="form-control" id="beschrijving" required></textarea>
      </div>

      <div class="mb-3">
        <label>Prijs (€)</label>
        <input type="number" step="0.01" class="form-control" id="prijs" required>
      </div>

      <div class="mb-3">
        <label>Categorie</label>
        <select class="form-select" id="categorie" required>
          <option value="vissen">Vissen</option>
          <option value="vistoebehoren">Vistoebehoren</option>
          <option value="vogels">Vogels</option>
          <option value="vogeltoebehoren">Vogeltoebehoren</option>
          <option value="services">Services</option>
        </select>
      </div>

      <div class="mb-3">
        <label>Afbeelding naam</label>
        <input type="text" class="form-control" id="afbeelding" placeholder="bijv. clownbotia" required>
      </div>

      <button type="submit" class="btn btn-success w-100">Product toevoegen</button>
    </form>

    <hr>

    <h4>Huidige producten</h4>
    <ul id="product-preview" class="list-group mb-3"></ul>

    <button id="download-json" class="btn btn-primary w-100">
      Download nieuw assortiment.json
    </button>

  </div>
</div>

<script>
const ADMIN_PASSWORD = "123&456&789";
let producten = [];

function checkLogin() {
  if (document.getElementById("wachtwoord").value === ADMIN_PASSWORD) {
    document.getElementById("login-box").style.display = "none";
    document.getElementById("admin-panel").style.display = "block";
  } else {
    alert("Onjuist wachtwoord");
  }
}

fetch("../data/assortiment.json")
  .then(res => res.json())
  .then(data => {
    producten = data;
    updatePreview();
  });

document.getElementById("product-form").addEventListener("submit", function(e) {
  e.preventDefault();

  let afbeeldingNaam = document.getElementById("afbeelding").value.trim();
  if (!afbeeldingNaam.toLowerCase().endsWith(".jpg")) {
    afbeeldingNaam += ".jpg";
  }

  const nieuwProduct = {
    titel: document.getElementById("titel").value,
    beschrijving: document.getElementById("beschrijving").value,
    prijs: parseFloat(document.getElementById("prijs").value),
    afbeelding: "images/" + afbeeldingNaam,
    categorie: document.getElementById("categorie").value
  };

  producten.push(nieuwProduct);
  updatePreview();
  this.reset();
});

function updatePreview() {
  const lijst = document.getElementById("product-preview");
  lijst.innerHTML = "";

  producten.forEach((p, index) => {
    const item = document.createElement("li");
    item.className = "list-group-item d-flex justify-content-between align-items-center";

    item.innerHTML = `
      <span>${p.titel} (${p.categorie})</span>
      <button class="btn btn-sm btn-danger" onclick="verwijderProduct(${index})">
        Verwijder
      </button>
    `;

    lijst.appendChild(item);
  });
}

function verwijderProduct(index) {
  if (confirm("Weet je zeker dat je dit product wilt verwijderen?")) {
    producten.splice(index, 1);
    updatePreview();
  }
}

document.getElementById("download-json").addEventListener("click", function() {
  const dataStr = JSON.stringify(producten, null, 2);
  const blob = new Blob([dataStr], { type: "application/json" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "assortiment.json";
  a.click();

  URL.revokeObjectURL(url);
});
</script>

</body>
</html>
