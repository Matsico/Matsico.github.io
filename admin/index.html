<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vin & Vleugel | Admin</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../style.css">

<style>
body { padding-top: 100px; }
.hidden { display: none; }
</style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="../index.html">
      <img src="../images/logo.png" height="40" class="me-2">
      Vin & Vleugel Admin
    </a>
  </div>
</nav>

<div class="container">

  <div id="loginSection">
    <h2>Admin Login</h2>
    <input type="password" id="token" class="form-control mb-2" placeholder="GitHub Personal Access Token">
    <button class="btn btn-dark" onclick="login()">Login</button>
  </div>

  <div id="adminSection" class="hidden">

    <h2 class="mt-4">Nieuw Product</h2>

    <input type="text" id="titel" class="form-control mb-2" placeholder="Titel">

    <textarea id="beschrijving" class="form-control mb-2" placeholder="Beschrijving"></textarea>

    <select id="categorie" class="form-select mb-2">
      <option value="Vissen">Vissen</option>
      <option value="Vistoebehoren">Vistoebehoren</option>
      <option value="Vogels">Vogels</option>
      <option value="Vogeltoebehoren">Vogeltoebehoren</option>
    </select>

    <input type="file" id="afbeelding" class="form-control mb-2" accept="image/*">

    <button class="btn btn-success" onclick="uploadProduct()">Opslaan</button>

    <hr>

    <h2>Producten</h2>
    <div id="productList"></div>

    <p id="status" class="mt-3"></p>

  </div>
</div>

<footer class="text-center mt-5 p-4">
  <img src="../images/logo.png" height="60">
  <p class="mb-0">© 2026 Vin & Vleugel</p>
</footer>

<script>

let githubToken = "";
const repo = "Matsico/Matsico.github.io";

function login() {
  githubToken = document.getElementById("token").value;
  if (!githubToken) return alert("Voer een token in.");

  document.getElementById("loginSection").classList.add("hidden");
  document.getElementById("adminSection").classList.remove("hidden");

  loadProducts();
}

function slugify(text) {
  return text.toLowerCase().replace(/\s+/g, "-").replace(/[^\w-]+/g, "");
}

async function getFileSha(path) {
  const res = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
    headers: { Authorization: `token ${githubToken}` }
  });

  if (res.status === 404) return null;
  const data = await res.json();
  return data.sha;
}

async function loadProducts() {
  const list = document.getElementById("productList");
  list.innerHTML = "Laden...";

  const res = await fetch(`https://api.github.com/repos/${repo}/contents/data/assortiment`, {
    headers: { Authorization: `token ${githubToken}` }
  });

  const files = await res.json();
  list.innerHTML = "";

  files.forEach(file => {
    if (file.name.endsWith(".json")) {
      const slug = file.name.replace(".json", "");

      list.innerHTML += `
        <div class="card p-3 mb-2">
          <strong>${slug}</strong>
          <button class="btn btn-danger btn-sm float-end" onclick="deleteProduct('${slug}')">
            Verwijderen
          </button>
        </div>
      `;
    }
  });
}

async function uploadProduct() {
  const titel = document.getElementById("titel").value;
  const beschrijving = document.getElementById("beschrijving").value;
  const categorie = document.getElementById("categorie").value;
  const fileInput = document.getElementById("afbeelding");

  if (!titel || !beschrijving || !fileInput.files[0]) {
    return alert("Vul alles in.");
  }

  const slug = slugify(titel);
  const imageFile = fileInput.files[0];

  const reader = new FileReader();
  reader.onload = async function () {

    const base64Image = reader.result.split(",")[1];

    await fetch(`https://api.github.com/repos/${repo}/contents/images/${slug}.jpg`, {
      method: "PUT",
      headers: {
        Authorization: `token ${githubToken}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: `Afbeelding toegevoegd: ${titel}`,
        content: base64Image
      })
    });

    const productData = {
      titel,
      beschrijving,
      categorie,
      afbeelding: `images/${slug}.jpg`
    };

    const jsonContent = btoa(unescape(encodeURIComponent(JSON.stringify(productData, null, 2))));

    await fetch(`https://api.github.com/repos/${repo}/contents/data/assortiment/${slug}.json`, {
      method: "PUT",
      headers: {
        Authorization: `token ${githubToken}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: `Product toegevoegd: ${titel}`,
        content: jsonContent
      })
    });

    document.getElementById("status").innerHTML = "Product toegevoegd!";
    loadProducts();
  };

  reader.readAsDataURL(imageFile);
}

async function deleteProduct(slug) {

  if (!confirm("Weet je zeker dat je dit product wil verwijderen?")) return;

  const jsonPath = `data/assortiment/${slug}.json`;
  const imagePath = `images/${slug}.jpg`;

  const jsonSha = await getFileSha(jsonPath);
  if (jsonSha) {
    await fetch(`https://api.github.com/repos/${repo}/contents/${jsonPath}`, {
      method: "DELETE",
      headers: {
        Authorization: `token ${githubToken}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: `Product verwijderd: ${slug}`,
        sha: jsonSha
      })
    });
  }

  const imageSha = await getFileSha(imagePath);
  if (imageSha) {
    await fetch(`https://api.github.com/repos/${repo}/contents/${imagePath}`, {
      method: "DELETE",
      headers: {
        Authorization: `token ${githubToken}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: `Afbeelding verwijderd: ${slug}`,
        sha: imageSha
      })
    });
  }

  document.getElementById("status").innerHTML = "Product verwijderd!";
  loadProducts();
}

</script>

</body>
</html>
