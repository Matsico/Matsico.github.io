  <meta charset="UTF-8">

    body { padding-top: 110px; }

      height: 250px;
      object-fit: cover;
    }
    .loading {
      text-align: center;
      font-size: 18px;
      padding: 40px;
    }
  </style>
</head>

<body>

<!-- NAVIGATIE -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom fixed-top">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="index.html">
      <img src="images/logo.png" height="40" class="me-2">
      Vin & Vleugel
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">

        <li class="nav-item">
          <a class="nav-link" href="index.html">Home</a>
        </li>

        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle active" href="#" role="button" data-bs-toggle="dropdown">
            Assortiment
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="assortiment.html">Assortiment</a></li>
            <li><a class="dropdown-item" href="services.html">Services</a></li>
          </ul>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="overons.html">Over ons</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="contact.html">Contact</a>
        </li>

      </ul>
    </div>
  </div>
</nav>

<main class="container">

  <h1 class="mb-4 text-center">Assortiment</h1>

  <!-- FILTER -->
  <div class="text-center mb-4">
    <button class="btn btn-outline-dark m-1 filter-btn active" data-cat="alles">Alles</button>
    <button class="btn btn-outline-dark m-1 filter-btn" data-cat="Vissen">Vissen</button>
    <button class="btn btn-outline-dark m-1 filter-btn" data-cat="Vistoebehoren">Vistoebehoren</button>
    <button class="btn btn-outline-dark m-1 filter-btn" data-cat="Vogels">Vogels</button>
    <button class="btn btn-outline-dark m-1 filter-btn" data-cat="Vogeltoebehoren">Vogeltoebehoren</button>
  </div>

  <div id="product-container" class="row">
    <div class="loading">Producten laden...</div>
  </div>

</main>

<footer class="footer-custom text-white text-center py-4 mt-5">
  <img src="images/logo.png" height="50" class="mb-3">
  <p class="mb-0">© 2026 Vin & Vleugel</p>
</footer>

<script>

let alleProducten = [];

/* ===============================
   Producten laden uit map
================================= */

async function laadProducten() {

  const container = document.getElementById("product-container");

  try {

    const res = await fetch(
      "https://api.github.com/repos/Matsico/Matsico.github.io/contents/data/assortiment"
    );

    const files = await res.json();

    alleProducten = [];

    for (const file of files) {

      if (!file.name.endsWith(".json")) continue;

      const productRes = await fetch(file.download_url);
      const product = await productRes.json();
      alleProducten.push(product);
    }

    toonProducten("alles");

  } catch (error) {
    container.innerHTML = "<p>Fout bij laden van producten.</p>";
  }
}

/* ===============================
   Producten tonen
================================= */

function toonProducten(categorie) {

  const container = document.getElementById("product-container");
  container.innerHTML = "";

  let gefilterd = alleProducten;

  if (categorie !== "alles") {
    gefilterd = alleProducten.filter(p => p.categorie === categorie);
  }

  if (gefilterd.length === 0) {
    container.innerHTML = "<p class='text-center'>Geen producten gevonden.</p>";
    return;
  }

  gefilterd.forEach(product => {

    const card = document.createElement("div");
    card.className = "col-md-4 mb-4";

    card.innerHTML = `
      <div class="card h-100 shadow-sm">
        <img src="${product.afbeelding}" 
             class="card-img-top product-img"
             alt="${product.titel}"
             loading="lazy">
        <div class="card-body d-flex flex-column">
          <h5>${product.titel}</h5>
          <p>${product.beschrijving}</p>
          <div class="mt-auto">
            <p class="fw-bold fs-5">€ ${Number(product.prijs).toFixed(2)}</p>
          </div>
        </div>
      </div>
    `;

    container.appendChild(card);
  });

  // actieve knop styling
  document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.classList.remove("btn-dark");
    btn.classList.add("btn-outline-dark");

    if (btn.dataset.cat === categorie) {
      btn.classList.remove("btn-outline-dark");
      btn.classList.add("btn-dark");
    }
  });

}

/* ===============================
   Filter knoppen
================================= */

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", function() {
    toonProducten(this.dataset.cat);
  });
});

laadProducten();

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
