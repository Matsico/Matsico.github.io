<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Assortiment | Vin & Vleugel</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Eigen CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAVIGATIE -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">Vin & Vleugel</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link active" href="assortiment.html">Assortiment</a></li>
        <li class="nav-item"><a class="nav-link" href="overons.html">Over ons</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- HERO -->
<header class="hero hero-small">
  <div class="hero-overlay">
    <h1>Assortiment</h1>
    <p>Zoetwater aquariumvissen & benodigdheden</p>
  </div>
</header>

<!-- CONTENT -->
<main class="container section" style="margin-top:120px;">
  <h2 class="mb-4">Ons aanbod</h2>
  <p>
    Bij Vin & Vleugel bieden wij een wisselend assortiment aan
    zoetwater aquariumvissen en aquariumbenodigdheden.
  </p>

  <div id="product-list" class="row mt-4">
    <p>Producten worden geladen...</p>
  </div>
</main>

<footer class="bg-dark text-white text-center py-3 mt-5">
  <p class="mb-0">© 2026 Vin & Vleugel</p>
</footer>

<script>
document.addEventListener("DOMContentLoaded", function () {

  fetch("data/assortiment.json")
    .then(response => {
      if (!response.ok) {
        throw new Error("JSON niet gevonden");
      }
      return response.json();
    })
    .then(data => {
      const container = document.getElementById("product-list");
      container.innerHTML = "";

      if (!data || data.length === 0) {
        container.innerHTML = "<p>Er zijn nog geen producten toegevoegd.</p>";
        return;
      }

      data.forEach(product => {
        const card = document.createElement("div");
        card.className = "col-md-4 mb-4";

        card.innerHTML = `
          <div class="card h-100 shadow-sm">
            <img src="${product.afbeelding}" class="card-img-top" alt="${product.titel}">
            <div class="card-body d-flex flex-column">
              <h5 class="card-title">${product.titel}</h5>
              <p class="card-text">${product.beschrijving}</p>
              <div class="mt-auto">
                <p class="fw-bold fs-5">€ ${Number(product.prijs).toFixed(2)}</p>
              </div>
            </div>
          </div>
        `;

        container.appendChild(card);
      });
    })
    .catch(error => {
      document.getElementById("product-list").innerHTML =
        "<p>Kon assortiment niet laden. Controleer of data/assortiment.json bestaat.</p>";
    });

});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
