<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Assortiment | Vin & Vleugel</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">Vin & Vleugel</a>

    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link active" href="assortiment.html">Assortiment</a></li>
        <li class="nav-item"><a class="nav-link" href="assortiment.html?cat=vissen">Vissen</a></li>
        <li class="nav-item"><a class="nav-link" href="assortiment.html?cat=vistoebehoren">Vistoebehoren</a></li>
        <li class="nav-item"><a class="nav-link" href="assortiment.html?cat=vogels">Vogels</a></li>
        <li class="nav-item"><a class="nav-link" href="assortiment.html?cat=vogeltoebehoren">Vogeltoebehoren</a></li>
        <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container" style="margin-top:120px;">
  <div id="content"></div>
</main>

<footer class="bg-dark text-white text-center py-3 mt-5">
  <p class="mb-0">© 2026 Vin & Vleugel</p>
</footer>

<script>
document.addEventListener("DOMContentLoaded", function () {

  const params = new URLSearchParams(window.location.search);
  const filterCategorie = params.get("cat");

  fetch("data/assortiment.json")
    .then(res => res.json())
    .then(data => {

      const content = document.getElementById("content");
      content.innerHTML = "";

      // categorie volgorde
      const categorieVolgorde = [
        "vissen",
        "vistoebehoren",
        "vogels",
        "vogeltoebehoren"
      ];

      if (filterCategorie) {
        // Filter actief
        const filtered = data.filter(p => p.categorie === filterCategorie);

        toonCategorie(filterCategorie, filtered);

      } else {
        // Geen filter → alles gegroepeerd tonen
        categorieVolgorde.forEach(cat => {
          const producten = data.filter(p => p.categorie === cat);
          if (producten.length > 0) {
            toonCategorie(cat, producten);
          }
        });
      }

      function toonCategorie(catNaam, producten) {

        const titel = document.createElement("h2");
        titel.className = "mt-5 mb-4 text-capitalize";
        titel.innerText = catNaam;

        content.appendChild(titel);

        const row = document.createElement("div");
        row.className = "row";

        producten.forEach(product => {
          const card = document.createElement("div");
          card.className = "col-md-4 mb-4";

          card.innerHTML = `
            <div class="card h-100 shadow-sm">
              <img src="${product.afbeelding}" 
                   class="card-img-top" 
                   alt="${product.titel}" 
                   style="height:250px; object-fit:cover;"
                   loading="lazy">
              <div class="card-body d-flex flex-column">
                <h5 class="card-title">${product.titel}</h5>
                <p class="card-text">${product.beschrijving}</p>
                <div class="mt-auto">
                  <p class="fw-bold fs-5">€ ${Number(product.prijs).toFixed(2)}</p>
                </div>
              </div>
            </div>
          `;

          row.appendChild(card);
        });

        content.appendChild(row);
      }

    });
});
</script>

</body>
</html>
