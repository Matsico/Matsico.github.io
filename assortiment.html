<script>

let alleProducten = [];

async function laadProducten() {

  const res = await fetch("https://api.github.com/repos/Matsico/Matsico.github.io/contents/data/assortiment");
  const files = await res.json();

  for (const file of files) {
    if (!file.name.endsWith(".json")) continue;

    const productRes = await fetch(file.download_url);
    const product = await productRes.json();
    alleProducten.push(product);
  }

  toonProducten("alles");
}

function toonProducten(categorie) {

  const container = document.getElementById("product-container");
  container.innerHTML = "";

  let gefilterd = alleProducten;

  if (categorie !== "alles") {
    gefilterd = alleProducten.filter(p =>
      p.categorie.toLowerCase() === categorie.toLowerCase()
    );
  }

  if (gefilterd.length === 0) {
    container.innerHTML = "<p>Geen producten gevonden.</p>";
    return;
  }

  gefilterd.forEach(product => {

    const card = document.createElement("div");
    card.className = "col-md-4 mb-4";

    card.innerHTML = `
      <div class="card h-100 shadow-sm">
        <img src="${product.afbeelding}" 
             class="card-img-top" 
             style="height:250px; object-fit:cover;"
             loading="lazy">
        <div class="card-body d-flex flex-column">
          <h5>${product.titel}</h5>
          <p>${product.beschrijving}</p>
          <div class="mt-auto">
            <p class="fw-bold fs-5">€ ${Number(product.prijs).toFixed(2)}</p>
          </div>
        </div>
      </div>
    `;

    container.appendChild(card);
  });

}

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", function() {
    toonProducten(this.dataset.cat);
  });
});

laadProducten();

</script>
