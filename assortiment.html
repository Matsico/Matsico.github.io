  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="index.html">
    <img src="images/logo.png" alt="Vin & Vleugel Logo" height="40" class="me-2">
    Vin & Vleugel
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">

        <li class="nav-item">
          <a class="nav-link" href="index.html">Home</a>
        </li>

        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle active" href="#" role="button" data-bs-toggle="dropdown">
            Assortiment
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="assortiment.html">Assortiment</a></li>

<main class="container" style="margin-top:120px;">

  <h1 class="mb-4">Assortiment</h1>

  <!-- CATEGORIE FILTER -->
  <div class="mb-4 text-center">
    <button class="btn btn-outline-dark m-1 filter-btn" data-cat="alles">Alles</button>
    <button class="btn btn-outline-dark m-1 filter-btn" data-cat="vissen">Vissen</button>
    <button class="btn btn-outline-dark m-1 filter-btn" data-cat="vistoebehoren">Vistoebehoren</button>
    <button class="btn btn-outline-dark m-1 filter-btn" data-cat="vogels">Vogels</button>
    <button class="btn btn-outline-dark m-1 filter-btn" data-cat="vogeltoebehoren">Vogeltoebehoren</button>
  </div>

  <div id="product-container" class="row"></div>

</main>

<footer class="footer-custom text-white text-center py-4 mt-5">
  <img src="images/logo.png" alt="Vin & Vleugel Logo" height="50" class="mb-3">
  <p class="mb-0">© 2026 Vin & Vleugel</p>
</footer>

<script>
let alleProducten = [];

fetch("data/assortiment.json")
  .then(res => res.json())
  .then(data => {
    alleProducten = data;
    toonProducten("alles");
  });

function toonProducten(categorie) {

  const container = document.getElementById("product-container");
  container.innerHTML = "";

  let gefilterd = alleProducten;

  if (categorie !== "alles") {
    gefilterd = alleProducten.filter(p => p.categorie === categorie);
  }

  if (gefilterd.length === 0) {
    container.innerHTML = "<p>Geen producten gevonden.</p>";
    return;
  }

  gefilterd.forEach(product => {

    const card = document.createElement("div");
    card.className = "col-md-4 mb-4";

    card.innerHTML = `
      <div class="card h-100 shadow-sm">
        <img src="${product.afbeelding}" 
             class="card-img-top" 
             alt="${product.titel}" 
             style="height:250px; object-fit:cover;"
             loading="lazy">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">${product.titel}</h5>
          <p class="card-text">${product.beschrijving}</p>
          <div class="mt-auto">
            <p class="fw-bold fs-5">€ ${Number(product.prijs).toFixed(2)}</p>
          </div>
        </div>
      </div>
    `;

    container.appendChild(card);
  });

  // actieve knop highlighten
  document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.classList.remove("btn-dark");
    btn.classList.add("btn-outline-dark");

    if (btn.dataset.cat === categorie) {
      btn.classList.remove("btn-outline-dark");
      btn.classList.add("btn-dark");
    }
  });
}

// knop events
document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", function() {
    toonProducten(this.dataset.cat);
  });
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
