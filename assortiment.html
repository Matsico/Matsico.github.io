<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assortiment | Vin & Vleugel</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<style>
body { padding-top:110px; }
.product-img { height:250px; object-fit:cover; }
.subfilter-container { overflow-x:auto; white-space:nowrap; }
.subfilter-container button { margin:4px; }
.section-title { margin-top:40px; }
.loading { text-align:center; padding:40px; }
</style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom fixed-top">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="/">
      <img src="images/logo.png" height="40" class="me-2">
      Vin & Vleugel
    </a>
  </div>
</nav>

<main class="container">

<h1 class="mb-4 text-center">Assortiment</h1>

<!-- Subcategorie filter -->
<div class="subfilter-container text-center mb-4" id="subfilters"></div>

<!-- Dieren -->
<h3 class="section-title">Vissen</h3>
<div id="dieren-container" class="row"></div>

<!-- Producten -->
<h3 class="section-title">Producten</h3>
<div id="product-container" class="row"></div>

</main>

<footer class="footer-custom text-center py-4 mt-5">
  <img src="images/logo.png" height="60">
  <p>© 2026 Vin & Vleugel</p>
</footer>

<script>

let alleProducten = [];
let actieveSub = "alles";

const subcategorieen = [
  "Aquaria","Techniek","Decoratie","Planten",
  "Plantenvoeding","Voeders","Medicatie","Diverse"
];

function maakSubFilters(){
  const container = document.getElementById("subfilters");
  container.innerHTML = "";

  container.innerHTML += `<button class="btn btn-dark" onclick="filterSub('alles')">Alles</button>`;

  subcategorieen.forEach(sub=>{
    container.innerHTML += `
      <button class="btn btn-outline-dark" onclick="filterSub('${sub}')">
        ${sub}
      </button>
    `;
  });
}

function filterSub(sub){
  actieveSub = sub;
  toonProducten();
  updateActiveButton();
}

function updateActiveButton(){
  document.querySelectorAll("#subfilters button").forEach(btn=>{
    btn.classList.remove("btn-dark");
    btn.classList.add("btn-outline-dark");
    if(btn.textContent === actieveSub || (actieveSub==="alles" && btn.textContent==="Alles")){
      btn.classList.remove("btn-outline-dark");
      btn.classList.add("btn-dark");
    }
  });
}

async function laadProducten(){

  const dierenContainer = document.getElementById("dieren-container");
  const productContainer = document.getElementById("product-container");

  dierenContainer.innerHTML = "<div class='loading'>Laden...</div>";
  productContainer.innerHTML = "";

  const res = await fetch(
  "https://api.github.com/repos/Matsico/Matsico.github.io/contents/data/assortiment");

  const files = await res.json();
  alleProducten = [];

  for(const file of files){
    if(!file.name.endsWith(".json")) continue;
    const productRes = await fetch(file.download_url);
    const product = await productRes.json();
    alleProducten.push(product);
  }

  toonProducten();
}

function toonProducten(){

  const dierenContainer = document.getElementById("dieren-container");
  const productContainer = document.getElementById("product-container");

  dierenContainer.innerHTML="";
  productContainer.innerHTML="";

  // Dieren tonen
  const dieren = alleProducten.filter(p =>
    p.producttype === "Dier" &&
    p.hoofdcategorie === "Vissen"
  );

  dieren.forEach(product=>{
    dierenContainer.innerHTML += kaart(product);
  });

  // Producten filteren
  let producten = alleProducten.filter(p =>
    p.producttype === "Product" &&
    p.hoofdcategorie === "Vissen"
  );

  if(actieveSub !== "alles"){
    producten = producten.filter(p => p.subcategorie === actieveSub);
  }

  producten.forEach(product=>{
    productContainer.innerHTML += kaart(product);
  });
}

function kaart(product){
  return `
  <div class="col-md-4 mb-4">
    <div class="card h-100 shadow-sm">
      <img src="${product.afbeelding}"
           class="card-img-top product-img"
           alt="${product.titel}"
           loading="lazy">
      <div class="card-body d-flex flex-column">
        <h5>${product.titel}</h5>
        <p>${product.beschrijving}</p>
        ${product.subcategorie ? `<small class="text-muted">${product.subcategorie}</small>` : ""}
        <div class="mt-auto">
          <p class="fw-bold fs-5">€ ${Number(product.prijs).toFixed(2)}</p>
        </div>
      </div>
    </div>
  </div>`;
}

maakSubFilters();
laadProducten();

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
